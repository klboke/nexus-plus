replicaCount: 2

image:
  repository: ghcr.io/klboke/kkrepo
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  httpPort: 8080
  managementPort: 8081

database:
  # Supported values: mysql, postgresql.
  type: mysql
  url: jdbc:mysql://mysql.example:3306/kkrepo?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=UTC
  username: kkrepo
  existingSecret: kkrepo-database
  passwordKey: password

externalDatabase:
  enabled: true

# The chart intentionally does not install a database StatefulSet by default.
embeddedDatabase:
  enabled: false

encryption:
  existingSecret: kkrepo-encryption
  credentialSecretKey: credential-secret
  apiKeyPayloadSecretKey: api-key-payload-secret

# Reference an existing Secret containing S3/OSS credentials and any extra app environment values.
extraEnvFrom: []
extraEnv: []

blobStorage:
  file:
    enabled: false
    # File storage is safe with replicas >1 only on a strong-consistency ReadWriteMany volume.
    existingClaim: ""
    mountPath: /var/lib/kkrepo/blobs

# Deployment capability for the optional isolated Syft/Grype adapter. Enabling this value deploys
# the adapter and starts kkRepo scan coordination; it does not activate scanning for any repository.
# Repository administrators select repositories in Admin > Security > Artifact Scanning.
# Task ownership and scan results stay in the shared relational database; the adapter volume
# contains only a rebuildable vulnerability database.
securityScanning:
  enabled: false
  metricsCountLimit: 10000
  image:
    repository: ghcr.io/klboke/kkrepo-scanner
    pullPolicy: IfNotPresent
    tag: ""
  replicaCount: 1
  service:
    port: 8080
  serviceCredential:
    existingSecret: kkrepo-scanner
    key: service-credential
  scannerDatabase:
    # Disabling the updater requires persistence.existingClaim to point at a pre-populated
    # immutable generation layout containing .kkrepo-db-current and generations/generation-*.
    autoUpdate: true
    updateInterval: 6h
    # Optional mirror for the Grype database listing and archives. Leave empty to use
    # Grype's default https://grype.anchore.io/databases endpoint.
    updateUrl: ""
    # Optional CA Secret for an HTTPS mirror. The selected Secret key is mounted as ca.crt.
    caCert:
      existingSecret: ""
      key: ca.crt
    # A separate non-serving CronJob checks the shared database on this schedule. The interval
    # above remains the minimum age between successful Grype updates.
    updateSchedule: "*/5 * * * *"
    updater:
      backoffLimit: 2
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      # A busy update exits non-zero after this publication-lock bound so the Job controller retries.
      lockTimeout: 10m
      scratchVolumeSize: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    maxAge: 48h
    observationMaxAge: 2m
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes: ["ReadWriteOnce"]
      size: 10Gi
  worker:
    batchSize: 4
    leaseSeconds: 300
    heartbeatSeconds: 60
    maxAttempts: 5
    maxBackoffSeconds: 1800
    artifactChangeBatchSize: 1000
    artifactChangeCleanupBatchSize: 5000
    artifactReconcileBatchSize: 1000
    artifactReconcileRecentWindow: 1d
    candidateBatchSize: 500
    backfillBatchSize: 500
    backfillMaxPagesPerRun: 20
    snapshotRematchBatchSize: 200
    snapshotRematchMaxBatches: 10
  retention:
    enabled: true
    terminalTaskDays: 30
    resultDays: 90
    batchSize: 200
    delay: 1h
    initialDelay: 5m
  limits:
    maxOciRequestBytes: '65536'
    maxInputBytes: '2147483648'
    maxOutputBytes: '16777216'
    maxResponseBytes: '67108864'
    maxResponseTokens: '262144'
    responseMemoryBudgetBytes: '268435456'
    maxStderrBytes: '262144'
    # Shared admission budget across concurrent scans. Keep this below scratchVolumeSize.
    maxScratchBytes: '7516192768'
    scratchVolumeSize: 8Gi
    maxConcurrentScans: 2
    maxQueuedScans: 4
    admissionTimeout: 1s
    retryAfterSeconds: 5
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 9Gi
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 3
  livenessProbe:
    periodSeconds: 20
    timeoutSeconds: 3
  networkPolicy:
    enabled: true
    # Restrict port 53 to the cluster DNS workload. Override both selectors when the cluster uses
    # different DNS labels; empty selectors are rejected instead of widening egress.
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
    # Optional explicit egress for a private HTTPS database mirror.
    databaseMirror:
      enabled: false
      cidr: ""
      port: 443

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

startupProbe:
  failureThreshold: 60
  periodSeconds: 5
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 45
