server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 32KB

spring:
  application:
    name: kkrepo-scanner-adapter
  servlet:
    multipart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,scanner
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UNKNOWN,UP
        http-mapping:
          degraded: 503

kkrepo:
  scanner:
    service-credential: ${KKREPO_SCANNER_SERVICE_CREDENTIAL:}
    work-directory: ${KKREPO_SCANNER_WORK_DIRECTORY:/tmp/kkrepo-scanner}
    syft-executable: ${KKREPO_SCANNER_SYFT_EXECUTABLE:syft}
    grype-executable: ${KKREPO_SCANNER_GRYPE_EXECUTABLE:grype}
    vulnerability-database-directory: ${KKREPO_SCANNER_DB_DIRECTORY:/var/lib/kkrepo-scanner/grype}
    vulnerability-database-update-url: ${KKREPO_SCANNER_DB_UPDATE_URL:${GRYPE_DB_UPDATE_URL:https://grype.anchore.io/databases}}
    vulnerability-database-ca-cert: ${KKREPO_SCANNER_DB_CA_CERT:${GRYPE_DB_CA_CERT:}}
    vulnerability-database-auto-update: ${KKREPO_SCANNER_DB_AUTO_UPDATE:false}
    database-update-only: ${KKREPO_SCANNER_DATABASE_UPDATE_ONLY:false}
    vulnerability-database-update-interval: ${KKREPO_SCANNER_DB_UPDATE_INTERVAL:6h}
    vulnerability-database-update-check-interval: ${KKREPO_SCANNER_DB_UPDATE_CHECK_INTERVAL:1m}
    max-oci-request-bytes: ${KKREPO_SCANNER_MAX_OCI_REQUEST_BYTES:65536}
    max-input-bytes: ${KKREPO_SCANNER_MAX_INPUT_BYTES:2147483648}
    max-output-bytes: ${KKREPO_SCANNER_MAX_OUTPUT_BYTES:16777216}
    max-stderr-bytes: ${KKREPO_SCANNER_MAX_STDERR_BYTES:262144}
    max-scratch-bytes: ${KKREPO_SCANNER_MAX_SCRATCH_BYTES:7516192768}
    readiness-cache: ${KKREPO_SCANNER_READINESS_CACHE:30s}
    max-concurrent-scans: ${KKREPO_SCANNER_MAX_CONCURRENT_SCANS:2}
    max-queued-scans: ${KKREPO_SCANNER_MAX_QUEUED_SCANS:4}
    admission-timeout: ${KKREPO_SCANNER_ADMISSION_TIMEOUT:1s}
    retry-after-seconds: ${KKREPO_SCANNER_RETRY_AFTER_SECONDS:5}
    database-update-lock-timeout: ${KKREPO_SCANNER_DATABASE_UPDATE_LOCK_TIMEOUT:10m}
